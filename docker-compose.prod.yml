version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trustbridge-db
    environment:
      POSTGRES_DB: trustbridge_escrow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ghcr.io/anshy0304/trustbridge-escrow-based-marketplace/backend:latest
    container_name: trustbridge-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/trustbridge_escrow
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    image: ghcr.io/anshy0304/trustbridge-escrow-based-marketplace/frontend:latest
    container_name: trustbridge-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
